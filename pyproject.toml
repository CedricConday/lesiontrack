[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lesiontrack"
version = "0.1.0"
description = "Longitudinal multiple sclerosis lesion evolution: lesion tracking and slowly expanding lesion (SEL) detection with a synthetic backtest gate."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Cedric Conday"}]
keywords = ["multiple sclerosis", "MRI", "lesion", "longitudinal", "slowly expanding lesions", "neuroimaging"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "nibabel>=5",
  "pandas>=2",
  "scikit-image>=0.21",
  "picsl_greedy>=1.4",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
lesiontrack = "lesiontrack.cli:main"

[tool.setuptools.packages.find]
include = ["lesiontrack*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
markers = ["slow: needs registration, minutes"]
